<div class="lang-switcher" role="group">
  <button
    type="button"
    class="lang"
    [attr.aria-pressed]="translation.lang() === 'en'"
    (click)="setLang('en')"
  >
    EN
  </button>
  <button
    type="button"
    class="lang"
    [attr.aria-pressed]="translation.lang() === 'es'"
    (click)="setLang('es')"
  >
    ES
  </button>
  <button
    type="button"
    class="lang"
    [attr.aria-pressed]="translation.lang() === 'ca'"
    (click)="setLang('ca')"
  >
    CA
  </button>
</div>

<div class="lang-switcher-compact">
  <button
    type="button"
    class="lang-current"
    [attr.aria-expanded]="compactMenuOpen()"
    (click)="toggleCompactMenu()"
  >
    {{ translation.lang() }} ▾
  </button>

  @if (compactMenuOpen()) {
    <div class="lang-dropdown">
      @for (lang of otherLangs; track lang) {
        <button type="button" (click)="setLang(lang)">{{ lang }}</button>
      }
    </div>
  }
</div>
