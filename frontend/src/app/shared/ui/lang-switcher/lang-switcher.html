<div class="lang-switcher" role="group">
  <button
    type="button"
    class="lang"
    [attr.aria-pressed]="translation.lang() === 'en'"
    (click)="setLang('en')"
  >
    EN
  </button>
  <button
    type="button"
    class="lang"
    [attr.aria-pressed]="translation.lang() === 'es'"
    (click)="setLang('es')"
  >
    ES
  </button>
  <button
    type="button"
    class="lang"
    [attr.aria-pressed]="translation.lang() === 'ca'"
    (click)="setLang('ca')"
  >
    CA
  </button>
</div>
