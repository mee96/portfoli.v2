<article class="entry">
  <span class="dt">{{ dt }}</span>
  <h4 class="title">
    {{ title }}
    @if (active) {
      <span class="badge">{{ activeLabel }}</span>
    }
    @if (verifyUrl) {
      <a
        [href]="verifyUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="verify-link"
        [attr.aria-label]="verifyLabel"
        [attr.data-tooltip]="verifyLabel"
      >
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"
          />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </a>
    }
  </h4>
  @if (org) {
    <p class="org">{{ org }}</p>
  }
  @if (description) {
    <p class="description">{{ description }}</p>
  }
  <div class="chips">
    @for (chip of chips; track chip) {
      <app-chip [label]="chip" />
    }
  </div>
</article>
