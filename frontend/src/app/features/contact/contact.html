<section class="contact">
  <app-section-header
    fig="Fig. 5"
    [title]="translation.t('contact.title')"
    [subtitle]="translation.t('contact.lede')"
  />

  <div class="layout">
    <div class="side">
      <div class="photo">
        @if (!photoFailed) {
          <img src="foto.jpg" alt="" (error)="onPhotoError()" />
        } @else {
          <div class="photo-placeholder">{{ translation.t('contact.photo') }}</div>
        }
      </div>

      <ul class="links">
        <li>
          <a href="mailto:dev.mee96@gmail.com">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            dev.mee96@gmail.com
          </a>
        </li>
        <li>
          <a [href]="cvHref()" download>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" x2="12" y1="15" y2="3"></line>
            </svg>
            CV
          </a>
        </li>
      </ul>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field">
        <span>{{ translation.t('contact.name') }}</span>
        <input type="text" formControlName="name" />
      </label>

      <label class="field">
        <span>{{ translation.t('contact.email') }}</span>
        <input type="email" formControlName="email" />
      </label>

      <label class="field">
        <span>{{ translation.t('contact.message') }}</span>
        <textarea formControlName="message"></textarea>
      </label>

      <div class="submit-row">
        <app-button
          type="submit"
          [label]="status() === 'sending' ? translation.t('contact.sending') : translation.t('contact.send')"
          [disabled]="form.invalid || status() === 'sending'"
        />

        @if (status() === 'success') {
          <p class="submit-status submit-status--success">{{ translation.t('contact.sent') }}</p>
        } @else if (status() === 'error') {
          <p class="submit-status submit-status--error">{{ translation.t('contact.error') }}</p>
        }
      </div>
    </form>
  </div>

  <footer class="site-footer">
    <div class="footer-top">
      <img
        class="footer-gif"
        src="Cat%20Spinning%20Sticker%20by%20Pusheen.gif"
        alt=""
        loading="lazy"
      />
      <span class="footer-text">Barcelona · Català · Español · English · © 2026</span>
      <img
        class="footer-gif"
        src="Embarrassed%20Video%20Games%20Sticker%20by%20Pusheen.gif"
        alt=""
        loading="lazy"
      />
    </div>

    <div class="footer-socials">
      <a href="https://github.com/mee96" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
          <path d="M9 18c-4.51 2-5-2-7-2"></path>
        </svg>
      </a>
      <a
        href="https://www.linkedin.com/in/carme-medina-canalda-250457132/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect width="4" height="12" x="2" y="9"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>
      <a
        href="https://www.instagram.com/caaarmeeen96/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
        </svg>
      </a>
    </div>
  </footer>
</section>
