<section class="training-log">
  <app-section-header
    fig="Fig. 4"
    [title]="translation.t('log.title')"
    [subtitle]="translation.t('log.sub')"
  />

  @for (group of groups(); track group.labelKey) {
    <div class="group">
      <h3 class="group-label">{{ translation.t(group.labelKey) }}</h3>
      @for (entry of group.entries; track entry.id) {
        <app-log-entry
          [dt]="entry.translations[translation.lang()].dt"
          [title]="entry.translations[translation.lang()].t"
          [org]="entry.org"
          [description]="entry.translations[translation.lang()].d"
          [chips]="entry.chips"
          [active]="entry.active ?? false"
          [activeLabel]="translation.t('log.active')"
          [verifyUrl]="entry.verifyUrl"
          [verifyLabel]="translation.t('log.verifyCredly')"
        />
      }
    </div>
  }
</section>
